[package]
name = "rubydung-rs"
version = "0.1.15"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "rubydung-rs"
path = "src/main.rs"

# Launcher: descarga la version original de Mojang y arranca el juego
[[bin]]
name = "rustium"
path = "src/bin/rustium.rs"

# Versiones pre-clasicas portadas, una por build original
[[bin]]
name = "rd132328"
path = "src/bin/rd132328.rs"

[[bin]]
name = "rd160052"
path = "src/bin/rd160052.rs"

[[bin]]
name = "rd20090515"
path = "src/bin/rd20090515.rs"

[[bin]]
name = "rd161348"
path = "src/bin/rd161348.rs"

# Classic reconstruidas (sus jars no se conservan)
[[bin]]
name = "classic009a"
path = "src/bin/classic009a.rs"

[[bin]]
name = "classic010a"
path = "src/bin/classic010a.rs"

# Primera version Classic conservada
[[bin]]
name = "classic011a"
path = "src/bin/classic011a.rs"

[dependencies]
winit = "0.30"
wgpu = "25"
pollster = "0.4"
png = "0.17"
zip = "2"
flate2 = "1"
# Solo para preguntar si hay una version nueva del launcher (una lectura)
ureq = "2.10"
# Interfaz del launcher (misma familia wgpu 25 / winit 0.30 que el juego)
eframe = "0.32"
# Selector nativo de carpetas para el directorio del juego de cada instancia
rfd = { version = "0.18", default-features = false }

[profile.release]
opt-level = 3
